name: Playwright + AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 🧠 Cache AI responses across CI runs — major cost saver
      # Hit rate is typically >90% once warm
      - name: Restore AI cache
        uses: actions/cache@v4
        with:
          path: .ai-cache
          key: ai-cache-${{ github.ref }}-${{ hashFiles('tests/**/*.ts') }}
          restore-keys: |
            ai-cache-${{ github.ref }}-
            ai-cache-

      - name: Run Playwright tests
        run: npx playwright test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
          AI_COST_CAP: 2.00
          CI: true

      - name: Save AI cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ai-cache
          key: ai-cache-${{ github.ref }}-${{ hashFiles('tests/**/*.ts') }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload heal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heal-report
          path: heal-report.json
          if-no-files-found: ignore
          retention-days: 30
